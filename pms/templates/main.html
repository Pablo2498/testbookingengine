<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PMS</title>
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css' rel='stylesheet' integrity='sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC' crossorigin='anonymous'>
    <link href='{% static 'css/style.css' %}' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="navbar-container">
        <nav class="navbar navbar-expand-lg navbar-modern fixed-top">
            <div class="container-fluid">
               <a class="navbar-brand-modern" href="{% url 'home'%}">
                   <div class="brand-logo">
                       <i class="bi bi-building"></i>
                   </div>
                   <div class="brand-text">
                       <span class="brand-name">CHAPP-Inn</span>
                       <span class="brand-subtitle">Hotel Management</span>
                   </div>
               </a>
               
               <button class="navbar-toggler-modern" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                   <span class="toggler-line"></span>
                   <span class="toggler-line"></span>
                   <span class="toggler-line"></span>
               </button>
               
               <div class="collapse navbar-collapse" id="navbarSupportedContent">
                  <ul class="navbar-nav navbar-nav-modern me-auto mb-2 mb-lg-0">
                     <li class="nav-item">
                        <a class="nav-link-modern {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home'%}">
                            <i class="bi bi-house-door"></i>
                            <span>Reservas</span>
                        </a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link-modern {% if request.resolver_match.url_name == 'search' %}active{% endif %}" href="{% url 'search'%}">
                            <i class="bi bi-plus-circle"></i>
                            <span>Nueva Reserva</span>
                        </a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link-modern {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard'%}">
                            <i class="bi bi-speedometer2"></i>
                            <span>Dashboard</span>
                        </a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link-modern {% if request.resolver_match.url_name == 'rooms' %}active{% endif %}" href="{% url 'rooms'%}">
                            <i class="bi bi-door-open"></i>
                            <span>Habitaciones</span>
                        </a>
                     </li>
                  </ul>
                  
                  <div class="navbar-search">
                      <form action="{% url 'booking_search'%}" method="GET" class="search-form-modern">
                         <div class="search-input-container">
                             <i class="bi bi-search search-icon-modern"></i>
                             <input class="search-input-modern" type="search" required name="filter" placeholder="Buscar reserva..." aria-label="Search">
                             <button class="search-btn-modern" type="submit">
                                 <i class="bi bi-arrow-right"></i>
                             </button>
                         </div>
                      </form>
                  </div>
               </div>
            </div>
         </nav>
    </div>
    <div class="container-xl">
        {% block content%}
        
        {% endblock %}
    </div>
</body>
</html>
